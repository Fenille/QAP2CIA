<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QAP — Acesso com Google</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .google-btn{display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:#222;border:1px solid #ddd}
    .google-icon{font:800 21px Arial;color:#4285f4}.account-note{text-align:center;color:#aaa;font-size:.85rem;line-height:1.45}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="brand"><div class="badge">QAP</div><h1>Sistema QAP</h1><p>Acesso restrito</p></div>
      <div id="message" class="message" hidden></div>
      <div class="panel active">
        <h2>Identificação</h2>
        <p class="account-note">Use sua conta Google. O nome e o e-mail autenticados serão registrados nas ações realizadas no sistema.</p>
        <button type="button" class="google-btn" id="entrarGoogle"><span class="google-icon">G</span>Entrar com Google</button>
      </div>
    </section>
  </main>
  <script type="module" src="login-google.js"></script>
</body>
</html>
